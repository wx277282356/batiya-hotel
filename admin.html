<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 芭堤雅酒店</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Admin Specific Styles */
        :root {
            --admin-sidebar-width: 240px;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            padding: var(--spacing-lg);
        }
        
        .login-box {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--spacing-xxl);
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        
        .login-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.75rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }
        
        .login-subtitle {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xl);
        }
        
        .login-form {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }
        
        .login-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1rem;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            text-align: center;
            letter-spacing: 4px;
            font-weight: 500;
        }
        
        .login-input:focus {
            outline: none;
            border-color: var(--brand-primary);
        }
        
        .login-btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: white;
            background: var(--brand-gradient);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-fast);
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .login-error {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: var(--spacing-sm);
        }
        
        /* Admin Layout */
        .admin-container {
            display: none;
            min-height: 100vh;
            background: var(--bg-secondary);
        }
        
        .admin-container.active {
            display: flex;
        }
        
        .admin-sidebar {
            width: var(--admin-sidebar-width);
            background: white;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 100;
        }
        
        .sidebar-header {
            padding: var(--spacing-lg);
            background: var(--brand-gradient);
            color: white;
        }
        
        .sidebar-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .sidebar-nav {
            flex: 1;
            padding: var(--spacing-md);
        }
        
        .nav-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-fast);
            margin-bottom: var(--spacing-xs);
        }
        
        .nav-item:hover,
        .nav-item.active {
            background: var(--bg-tertiary);
            color: var(--brand-primary);
        }
        
        .nav-item.active {
            font-weight: 500;
            background: linear-gradient(135deg, rgba(139, 69, 19, 0.1) 0%, rgba(205, 133, 63, 0.1) 100%);
        }
        
        .nav-item svg {
            flex-shrink: 0;
        }
        
        .sidebar-footer {
            padding: var(--spacing-md);
            border-top: 1px solid var(--border);
        }
        
        .logout-btn {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-fast);
        }
        
        .logout-btn:hover {
            border-color: var(--error);
            color: var(--error);
        }
        
        /* Admin Main */
        .admin-main {
            flex: 1;
            margin-left: var(--admin-sidebar-width);
            padding: var(--spacing-xl);
        }
        
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .admin-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .admin-actions {
            display: flex;
            gap: var(--spacing-md);
        }
        
        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-lg);
            font-size: 0.875rem;
            font-weight: 500;
            color: white;
            background: var(--brand-gradient);
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-fast);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .btn-outline {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-lg);
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--brand-primary);
            background: white;
            border: 1.5px solid var(--brand-primary);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: var(--transition-fast);
        }
        
        .btn-outline:hover {
            background: var(--bg-tertiary);
        }
        
        /* Stats Cards */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--spacing-lg);
            margin-bottom: var(--spacing-xl);
        }
        
        .stat-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }
        
        .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-sm);
        }
        
        .stat-value {
            font-family: 'DM Sans', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--brand-primary);
        }
        
        /* Table */
        .table-container {
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }
        
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border);
        }
        
        .table-title {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .table-filters {
            display: flex;
            gap: var(--spacing-md);
            align-items: center;
        }
        
        .filter-input {
            padding: var(--spacing-sm) var(--spacing-md);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.875rem;
        }
        
        .table-wrapper {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }
        
        th {
            background: var(--bg-secondary);
            padding: var(--spacing-md) var(--spacing-lg);
            text-align: left;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        
        td {
            padding: var(--spacing-md) var(--spacing-lg);
            border-top: 1px solid var(--border);
            font-size: 0.875rem;
        }
        
        tbody tr:hover {
            background: var(--bg-secondary);
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .status-pending {
            background: #FFF3E0;
            color: #E65100;
        }
        
        .status-confirmed {
            background: #E8F5E9;
            color: #2E7D32;
        }
        
        .status-cancelled {
            background: #FFEBEE;
            color: #C62828;
        }
        
        /* Empty State */
        .empty-state {
            padding: var(--spacing-xxl);
            text-align: center;
            color: var(--text-secondary);
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: var(--spacing-md);
            opacity: 0.5;
        }
        
        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-lg);
        }
        
        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: white;
            cursor: pointer;
            transition: var(--transition-fast);
        }
        
        .page-btn:hover:not(:disabled) {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
        }
        
        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Room Type Management */
        .room-list {
            display: grid;
            gap: var(--spacing-md);
        }
        
        .room-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
        }
        
        .room-info {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }
        
        .room-name {
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .room-price {
            font-family: 'DM Sans', sans-serif;
            color: var(--brand-primary);
            font-weight: 500;
        }
        
        .room-actions {
            display: flex;
            gap: var(--spacing-sm);
        }
        
        .icon-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition-fast);
        }
        
        .icon-btn:hover {
            background: var(--bg-tertiary);
            color: var(--brand-primary);
        }
        
        .icon-btn.delete:hover {
            background: #FFEBEE;
            color: var(--error);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: var(--spacing-lg);
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-box {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--spacing-xl);
            width: 100%;
            max-width: 400px;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-lg);
        }
        
        .modal-title {
            font-weight: 600;
            font-size: 1.125rem;
        }
        
        .modal-close {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
        }
        
        .modal-close:hover {
            background: var(--bg-secondary);
        }
        
        .modal-body {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-xs);
        }
        
        .form-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        
        .form-input {
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 1rem;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--brand-primary);
        }
        
        .modal-footer {
            display: flex;
            gap: var(--spacing-md);
            margin-top: var(--spacing-lg);
        }
        
        .modal-footer button {
            flex: 1;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-fast);
        }
        
        .btn-cancel {
            background: white;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        
        .btn-cancel:hover {
            background: var(--bg-secondary);
        }
        
        .btn-save {
            background: var(--brand-gradient);
            border: none;
            color: white;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        /* Settings Section */
        .settings-section {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            box-shadow: var(--shadow-sm);
            margin-bottom: var(--spacing-lg);
        }
        
        .settings-title {
            font-weight: 600;
            margin-bottom: var(--spacing-lg);
            color: var(--text-primary);
        }
        
        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-md);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .admin-sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }
            
            .admin-sidebar.open {
                transform: translateX(0);
            }
            
            .admin-main {
                margin-left: 0;
                padding: var(--spacing-md);
            }
            
            .admin-header {
                flex-direction: column;
                gap: var(--spacing-md);
                align-items: flex-start;
            }
            
            .stats-row {
                grid-template-columns: 1fr;
            }
            
            .table-header {
                flex-direction: column;
                gap: var(--spacing-md);
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div class="login-container" id="loginPage">
        <div class="login-box">
            <h1 class="login-title">芭堤雅酒店</h1>
            <p class="login-subtitle">请输入管理员密码</p>
            <form class="login-form" id="loginForm">
                <input type="password" class="login-input" id="passwordInput" placeholder="●●●●●●" maxlength="20" required>
                <button type="submit" class="login-btn">登录</button>
                <p class="login-error" id="loginError" style="display: none;">密码错误</p>
            </form>
            <p style="margin-top: 24px; font-size: 12px; color: #999;">默认密码: admin123</p>
        </div>
    </div>

    <!-- Admin Container -->
    <div class="admin-container" id="adminContainer">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">芭堤雅酒店</div>
                <div style="font-size: 12px; opacity: 0.8; margin-top: 4px;">管理后台</div>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-item active" data-tab="bookings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                    订单管理
                </a>
                <a class="nav-item" data-tab="rooms">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M2 20h20M4 20V8l8-5 8 5v12M10 20v-6h4v6"/>
                    </svg>
                    房型管理
                </a>
                <a class="nav-item" data-tab="settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    基本设置
                </a>
            </nav>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    退出登录
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Bookings Tab -->
            <div class="tab-content" id="bookingsTab">
                <div class="admin-header">
                    <h1 class="admin-title">订单管理</h1>
                    <div class="admin-actions">
                        <button class="btn-outline" id="refreshBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="23 4 23 10 17 10"></polyline>
                                <polyline points="1 20 1 14 7 14"></polyline>
                                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                            </svg>
                            刷新
                        </button>
                        <button class="btn-primary" id="exportBtn">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                            导出Excel
                        </button>
                    </div>
                </div>

                <!-- Stats -->
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-label">总订单数</div>
                        <div class="stat-value" id="totalBookings">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">今日新增</div>
                        <div class="stat-value" id="todayBookings">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">待确认</div>
                        <div class="stat-value" id="pendingBookings">0</div>
                    </div>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <div class="table-header">
                        <span class="table-title">预约订单列表</span>
                        <div class="table-filters">
                            <input type="date" class="filter-input" id="filterDate">
                        </div>
                    </div>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th>订单编号</th>
                                    <th>入住日期</th>
                                    <th>退房日期</th>
                                    <th>入住人</th>
                                    <th>手机号</th>
                                    <th>房型</th>
                                    <th>房价/晚</th>
                                    <th>状态</th>
                                    <th>下单时间</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTableBody">
                                <!-- 动态填充 -->
                            </tbody>
                        </table>
                    </div>
                    <div class="empty-state" id="emptyState" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        <p>暂无订单记录</p>
                    </div>
                </div>
            </div>

            <!-- Rooms Tab -->
            <div class="tab-content" id="roomsTab" style="display: none;">
                <div class="admin-header">
                    <h1 class="admin-title">房型管理</h1>
                    <button class="btn-primary" id="addRoomBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        添加房型
                    </button>
                </div>
                <div class="room-list" id="roomList">
                    <!-- 动态填充 -->
                </div>
            </div>

            <!-- Settings Tab -->
            <div class="tab-content" id="settingsTab" style="display: none;">
                <div class="admin-header">
                    <h1 class="admin-title">基本设置</h1>
                </div>
                <div class="settings-section">
                    <div class="settings-title">酒店信息</div>
                    <div class="settings-grid">
                        <div class="form-group">
                            <label class="form-label">酒店名称</label>
                            <input type="text" class="form-input" id="settingHotelName" placeholder="请输入酒店名称">
                        </div>
                        <div class="form-group">
                            <label class="form-label">联系电话</label>
                            <input type="text" class="form-input" id="settingPhone" placeholder="请输入联系电话">
                        </div>
                    </div>
                    <button class="btn-primary" id="saveSettingsBtn" style="margin-top: 16px;">保存设置</button>
                </div>
                <div class="settings-section">
                    <div class="settings-title">修改管理员密码</div>
                    <div class="settings-grid">
                        <div class="form-group">
                            <label class="form-label">新密码</label>
                            <input type="password" class="form-input" id="newPassword" placeholder="请输入新密码">
                        </div>
                        <div class="form-group">
                            <label class="form-label">确认密码</label>
                            <input type="password" class="form-input" id="confirmPassword" placeholder="请再次输入新密码">
                        </div>
                    </div>
                    <button class="btn-outline" id="changePasswordBtn" style="margin-top: 16px;">修改密码</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Room Modal -->
    <div class="modal-overlay" id="roomModal">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="roomModalTitle">添加房型</span>
                <button class="modal-close" id="closeRoomModal">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">房型名称</label>
                    <input type="text" class="form-input" id="roomNameInput" placeholder="例如：豪华大床房">
                </div>
                <div class="form-group">
                    <label class="form-label">房价（元/晚）</label>
                    <input type="number" class="form-input" id="roomPriceInput" placeholder="例如：398" min="0">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" id="cancelRoomBtn">取消</button>
                <button class="btn-save" id="saveRoomBtn">保存</button>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
