<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>在线预订 - 芭堤雅酒店</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Header -->
        <header class="header">
            <div class="logo-upload" id="logoUpload">
                <div class="logo-placeholder" id="logoPlaceholder">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M3 21h18M5 21V7l8-4 8 4v14M9 21v-6h6v6M9 9h.01M15 9h.01M9 13h.01M15 13h.01"/>
                    </svg>
                    <span>上传Logo</span>
                </div>
                <img id="logoPreview" class="logo-preview hidden" alt="酒店Logo">
                <input type="file" id="logoInput" accept="image/*" class="hidden">
            </div>
            <h1 class="hotel-name" id="hotelName">芭堤雅酒店</h1>
            <p class="hotel-slogan">热带风情，尊享假日</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <form id="bookingForm" class="booking-form">
                <!-- Date Section -->
                <div class="form-section">
                    <div class="date-row">
                        <div class="form-group">
                            <label class="form-label">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                入住日期
                            </label>
                            <input type="date" id="checkInDate" class="form-input" required>
                        </div>
                        <div class="date-arrow">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M5 12h14M12 5l7 7-7 7"/>
                            </svg>
                        </div>
                        <div class="form-group">
                            <label class="form-label">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                    <line x1="16" y1="2" x2="16" y2="6"></line>
                                    <line x1="8" y1="2" x2="8" y2="6"></line>
                                    <line x1="3" y1="10" x2="21" y2="10"></line>
                                </svg>
                                退房日期
                            </label>
                            <input type="date" id="checkOutDate" class="form-input" required>
                        </div>
                    </div>
                    <div class="night-info" id="nightInfo">请选择入住日期</div>
                </div>

                <!-- Guest Info Section -->
                <div class="form-section">
                    <div class="form-group">
                        <label class="form-label">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            入住人姓名
                        </label>
                        <input type="text" id="guestName" class="form-input" placeholder="请输入真实姓名" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                            </svg>
                            手机号码
                        </label>
                        <input type="tel" id="phone" class="form-input" placeholder="请输入手机号码" maxlength="11" required>
                    </div>
                </div>

                <!-- Room Type Section -->
                <div class="form-section">
                    <div class="form-group">
                        <label class="form-label">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 20h20M4 20V8l8-5 8 5v12M10 20v-6h4v6"/>
                            </svg>
                            选择房型
                        </label>
                        <div class="select-wrapper">
                            <select id="roomType" class="form-select" required>
                                <option value="">请选择房型</option>
                            </select>
                            <svg class="select-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>
                    <div class="room-price-display" id="roomPriceDisplay" style="display: none;">
                        <span class="price-label">房价</span>
                        <span class="price-value" id="selectedRoomPrice">¥0</span>
                        <span class="price-unit">/ 晚</span>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-text">提交预约</span>
                    <span class="btn-loading hidden">
                        <svg class="spinner" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="60 30"/>
                        </svg>
                        提交中...
                    </span>
                </button>
            </form>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <div class="contact-info">
                <a href="tel:400-888-8888" class="contact-link">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <span id="footerPhone">400-888-8888</span>
                </a>
            </div>
            <p class="footer-desc">退订或修改请联系上方电话</p>
            <p class="copyright">© 2024 芭堤雅酒店 保留所有权利</p>
        </footer>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="success-icon">
                <svg viewBox="0 0 52 52" class="checkmark">
                    <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                    <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                </svg>
            </div>
            <h2 class="success-title">预约成功</h2>
            <p class="success-desc">我们将尽快与您联系确认</p>
            <div class="booking-summary" id="bookingSummary">
                <!-- 动态填充 -->
            </div>
            <button type="button" class="btn-secondary" id="backBtn">返回首页</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="toast-message"></span>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.15.0/dist/av-min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
